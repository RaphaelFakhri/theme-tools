cases:
  - name: should parse raw-like tags (1)
    source: "

      \            {% javascript %}

      \              {% liquid

      \                assign x = 1

      \                assign x = 2

      \              %}

      \              /* comment string */

      \            {% endjavascript %}

      \          "
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position:
        start: [0, 0]
        highlight: "

          \            {% javascript %}

          \              {% liquid

          \                assign x = 1

          \                assign x = 2

          \              %}

          \              /* comment string */

          \            {% endjavascript %}

          \          "
      children:
        - type: LiquidRawTag
          name: javascript
          markup: ""
          markupPosition: { start: [1, 26], highlight: "" }
          whitespaceStart: ""
          whitespaceEnd: ""
          delimiterWhitespaceStart: ""
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [1, 12], highlight: "{% javascript %}" }
          blockEndPosition: { start: [7, 12], highlight: "{% endjavascript %}" }
          position:
            start: [1, 12]
            highlight: |-
              {% javascript %}
                            {% liquid
                              assign x = 1
                              assign x = 2
                            %}
                            /* comment string */
                          {% endjavascript %}
          body:
            type: RawMarkup
            kind: javascript
            value: "

              \              {% liquid

              \                assign x = 1

              \                assign x = 2

              \              %}

              \              /* comment string */

              \            "
            position:
              start: [1, 28]
              highlight: "

                \              {% liquid

                \                assign x = 1

                \                assign x = 2

                \              %}

                \              /* comment string */

                \            "
            nodes:
              - type: LiquidTag
                name: liquid
                whitespaceStart: ""
                whitespaceEnd: ""
                blockStartPosition:
                  start: [2, 14]
                  highlight: |-
                    {% liquid
                                    assign x = 1
                                    assign x = 2
                                  %}
                markupPosition:
                  start: [2, 23]
                  highlight: "

                    \                assign x = 1

                    \                assign x = 2

                    \              "
                position:
                  start: [2, 14]
                  highlight: |-
                    {% liquid
                                    assign x = 1
                                    assign x = 2
                                  %}
                markup:
                  - type: LiquidTag
                    name: assign
                    whitespaceStart: ""
                    whitespaceEnd: ""
                    blockStartPosition: { start: [3, 16], highlight: assign x = 1 }
                    markupPosition: { start: [3, 23], highlight: x = 1 }
                    position: { start: [3, 16], highlight: assign x = 1 }
                    markup:
                      type: AssignMarkup
                      name: x
                      position: { start: [3, 23], highlight: x = 1 }
                      value:
                        type: LiquidVariable
                        rawSource: "1"
                        position: { start: [3, 27], highlight: "1" }
                        expression:
                          type: Number
                          value: "1"
                          position: { start: [3, 27], highlight: "1" }
                        filters: []
                  - type: LiquidTag
                    name: assign
                    whitespaceStart: ""
                    whitespaceEnd: ""
                    blockStartPosition: { start: [4, 16], highlight: assign x = 2 }
                    markupPosition: { start: [4, 23], highlight: x = 2 }
                    position: { start: [4, 16], highlight: assign x = 2 }
                    markup:
                      type: AssignMarkup
                      name: x
                      position: { start: [4, 23], highlight: x = 2 }
                      value:
                        type: LiquidVariable
                        rawSource: "2"
                        position: { start: [4, 27], highlight: "2" }
                        expression:
                          type: Number
                          value: "2"
                          position: { start: [4, 27], highlight: "2" }
                        filters: []
              - type: TextNode
                value: /* comment string */
                position: { start: [6, 14], highlight: /* comment string */ }
