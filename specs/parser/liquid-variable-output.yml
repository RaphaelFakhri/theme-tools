cases:
  - name: should transform a base case Liquid Drop into a LiquidVariableOutput
    source: "{{ !-asd }}"
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], highlight: "{{ !-asd }}" }
      children:
        - type: LiquidVariableOutput
          markup: "!-asd"
          whitespaceStart: ""
          whitespaceEnd: ""
          markupPosition: { start: [0, 2], highlight: " !-asd " }
          position: { start: [0, 0], highlight: "{{ !-asd }}" }
  - name: should set LiquidVariable end position to the markup boundary (Bug 7 regression) (1)
    source: "{{ product.title }}"
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], highlight: "{{ product.title }}" }
      children:
        - type: LiquidVariableOutput
          whitespaceStart: ""
          whitespaceEnd: ""
          markupPosition: { start: [0, 2], highlight: " product.title " }
          position: { start: [0, 0], highlight: "{{ product.title }}" }
          markup:
            type: LiquidVariable
            rawSource: product.title
            position: { start: [0, 3], highlight: "product.title " }
            expression:
              type: VariableLookup
              name: product
              position: { start: [0, 3], highlight: product.title }
              lookups:
                - type: String
                  value: title
                  position: { start: [0, 11], highlight: title }
              lookupModes: [bareword]
            filters: []
