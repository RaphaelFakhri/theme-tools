cases:
  - name: should not include a leading newline in comment body.value inside {% liquid %}
    source: |-
      {% liquid
      comment
      this is a comment
      endcomment
      %}
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position:
        start: [0, 0]
        highlight: |-
          {% liquid
          comment
          this is a comment
          endcomment
          %}
      children:
        - type: LiquidTag
          name: liquid
          whitespaceStart: ""
          whitespaceEnd: ""
          blockStartPosition:
            start: [0, 0]
            highlight: |-
              {% liquid
              comment
              this is a comment
              endcomment
              %}
          markupPosition:
            start: [0, 9]
            highlight: |
              
              comment
              this is a comment
              endcomment
          position:
            start: [0, 0]
            highlight: |-
              {% liquid
              comment
              this is a comment
              endcomment
              %}
          markup:
            - type: LiquidRawTag
              name: comment
              markup: ""
              markupPosition: { start: [1, 7], highlight: "" }
              whitespaceStart: ""
              whitespaceEnd: ""
              delimiterWhitespaceStart: ""
              delimiterWhitespaceEnd: ""
              blockStartPosition: { start: [1, 0], highlight: comment }
              blockEndPosition: { start: [3, 0], highlight: endcomment }
              position:
                start: [1, 0]
                highlight: |-
                  comment
                  this is a comment
                  endcomment
              body:
                type: RawMarkup
                kind: text
                value: |
                  this is a comment
                position:
                  start: [1, 7]
                  highlight: |
                    
                    this is a comment
                nodes:
                  - type: TextNode
                    value: this is a comment
                    position: { start: [2, 0], highlight: this is a comment }
  - name: should parse an empty liquid tag
    source: "{% liquid %}"
    parse: [html]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], highlight: "{% liquid %}" }
      children:
        - type: LiquidTag
          name: liquid
          whitespaceStart: ""
          whitespaceEnd: ""
          blockStartPosition: { start: [0, 0], highlight: "{% liquid %}" }
          markupPosition: { start: [0, 10], highlight: "" }
          position: { start: [0, 0], highlight: "{% liquid %}" }
          markup: []
