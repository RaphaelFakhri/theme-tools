          name: liquid
          whitespaceStart: ""
          whitespaceEnd: ""
          blockStartPosition:
            start: [0, 0]
            highlight: |-
              {% liquid
              echo "hi"
              %}
          markupPosition:
            start: [0, 9]
            highlight: |
              
              echo "hi"
          position:
            start: [0, 0]
            highlight: |-
              {% liquid
              echo "hi"
              %}
          markup:
            - type: LiquidTag
              name: echo
              whitespaceStart: ""
              whitespaceEnd: ""
              blockStartPosition: { start: [1, 0], highlight: echo "hi" }
              markupPosition: { start: [1, 5], highlight: '"hi"' }
              position: { start: [1, 0], highlight: echo "hi" }
              markup:
                type: LiquidVariable
