            - type: LiquidTag
              name: echo
              whitespaceStart: ""
              whitespaceEnd: ""
              blockStartPosition: { start: [2, 0], highlight: echo x }
              markupPosition: { start: [2, 5], highlight: x }
              position: { start: [2, 0], highlight: echo x }
              markup:
                type: LiquidVariable
                rawSource: x
                position: { start: [2, 5], highlight: x }
                expression:
                  type: VariableLookup
                  name: x
                  position: { start: [2, 5], highlight: x }
                  lookups: []
                  lookupModes: []
                filters: []
