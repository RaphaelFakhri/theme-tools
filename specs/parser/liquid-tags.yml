cases:
  - name: should transform a basic Liquid Tag into a LiquidTag
    source: "{% name %}{% if -%}{%- endif %}"
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], highlight: "{% name %}{% if -%}{%- endif %}" }
      children:
        - type: LiquidTag
          name: name
          markup: ""
          whitespaceStart: ""
          whitespaceEnd: ""
          blockStartPosition: { start: [0, 0], highlight: "{% name %}" }
          markupPosition: { start: [0, 8], highlight: "" }
          position: { start: [0, 0], highlight: "{% name %}" }
        - type: LiquidTag
          name: if
          markup: ""
          whitespaceStart: ""
          whitespaceEnd: "-"
          delimiterWhitespaceStart: "-"
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [0, 10], highlight: "{% if -%}" }
          blockEndPosition: { start: [0, 19], highlight: "{%- endif %}" }
          markupPosition: { start: [0, 16], highlight: "" }
          position: { start: [0, 10], highlight: "{% if -%}{%- endif %}" }
          reason: Expected expression but found EndOfString ()
          children:
            - type: LiquidBranch
              name: null
              markup: ""
              whitespaceStart: ""
              whitespaceEnd: ""
              markupPosition: { start: [0, 19], highlight: "" }
              blockStartPosition: { start: [0, 19], highlight: "" }
              blockEndPosition: { start: [0, 19], highlight: "" }
              position: { start: [0, 19], highlight: "" }
              children: []
